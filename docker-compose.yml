# Local stack: `docker compose up --build`, then open http://localhost:4200.
# Values come from .env (copy .env.example). The fallbacks below are local-only
# placeholders so a clean clone starts without one; never reuse them elsewhere.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secretmatch}
      POSTGRES_USER: ${POSTGRES_USER:-secretmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local mail catcher: every email the API sends shows up at http://localhost:8025,
  # nothing is really delivered.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-secretmatch}
      DATABASE_USERNAME: ${POSTGRES_USER:-secretmatch}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CORS_ALLOWED_ORIGIN: http://localhost:${SPA_PORT:-4200}
      MAILPIT_URL: http://mailpit:8025
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@secretmatch.local}
      APP_BASE_URL: http://localhost:${SPA_PORT:-4200}
    ports:
      - "${API_PORT:-8080}:8080"

  spa:
    build: ./frontend
    environment:
      # Called by the browser, so it is the API's address as seen from the host.
      API_BASE_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${SPA_PORT:-4200}:80"

volumes:
  postgres-data:
