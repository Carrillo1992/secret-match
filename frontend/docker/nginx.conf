server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Deployment-specific: never let a browser keep a stale copy.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The installable app (#117): a stale copy of these would keep installed apps on an old build.
    location ~ ^/(app-sw\.js|ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # nginx's mime.types does not know the extension.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
