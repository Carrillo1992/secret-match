<app-sheet-layout>
  <div class="flex flex-col items-center gap-6 text-center">
    <div class="flex flex-col gap-2">
      <h1 class="font-display text-4xl font-bold tracking-tight">SecretMatch</h1>
      <p class="text-lg text-ink-muted">Tu amigo invisible, sin papelitos.</p>
    </div>
    <div class="flex w-full flex-col items-center gap-2">
      <a routerLink="/sign-up" appButton class="w-full">Crear cuenta</a>
      <a routerLink="/sign-in" appLink standalone>Iniciar sesión</a>
    </div>

    <div role="status" aria-live="polite" class="flex flex-col items-center gap-3">
      @switch (health.status()) {
        @case ('checking') {
          <p class="text-ink-muted">Comprobando la API…</p>
        }
        @case ('up') {
          <p class="rounded-full bg-success-soft px-4 py-1 font-semibold text-success">API OK</p>
        }
        @case ('down') {
          <p class="rounded-full bg-danger-soft px-4 py-1 font-semibold text-danger">
            No se puede conectar con la API
          </p>
          <button type="button" appButton="secondary" (click)="health.recheck()">Reintentar</button>
        }
      }
    </div>
  </div>
</app-sheet-layout>
