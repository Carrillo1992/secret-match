<main
  class="flex min-h-dvh flex-col items-center justify-center gap-6 bg-slate-50 px-4 text-center"
>
  <h1 class="text-4xl font-bold text-slate-900">SecretMatch</h1>
  <p class="max-w-md text-slate-600">Tu amigo invisible, sin papelitos.</p>

  <div role="status" aria-live="polite" class="flex flex-col items-center gap-3">
    @switch (health.status()) {
      @case ('checking') {
        <p class="text-slate-500">Comprobando la API…</p>
      }
      @case ('up') {
        <p class="rounded-full bg-green-100 px-4 py-1 font-semibold text-green-800">API OK</p>
      }
      @case ('down') {
        <p class="rounded-full bg-red-100 px-4 py-1 font-semibold text-red-800">
          No se puede conectar con la API
        </p>
        <button
          type="button"
          class="rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
          (click)="health.recheck()"
        >
          Reintentar
        </button>
      }
    }
  </div>
</main>
