<app-shell>
  <a routerLink="/home" appLink standalone class="gap-1">
    <svg lucideChevronLeft [size]="18"></svg>
    Mis grupos
  </a>

  @if (isLoading()) {
    <p role="status" class="mt-4 text-ink-muted">Cargando…</p>
  } @else if (group(); as group) {
    <h1 class="mt-4 font-display text-3xl font-bold tracking-tight break-words">
      {{ group.name }}
    </h1>

    <app-group-details-card
      class="mt-6"
      [group]="group"
      [status]="editStatus()"
      (save)="edit($event)"
    />

    <app-invite-link-card
      class="mt-6"
      [link]="inviteLink()"
      [admin]="group.admin"
      [regenerateStatus]="regenerateStatus()"
      (regenerate)="regenerateInviteLink()"
    />

    <app-members-card
      class="mt-6"
      [members]="group.members"
      [canRemove]="group.admin"
      [removal]="removal()"
      (remove)="removeMember($event)"
    />

    <app-membership-card
      class="mt-6"
      [admin]="group.admin"
      [status]="leaveStatus()"
      (leave)="leave()"
      [deleteStatus]="deleteStatus()"
      (deleteGroup)="deleteGroup()"
    />
  } @else if (notFound()) {
    <div class="mt-6">
      <app-status-header>
        <svg lucideSearchX statusIcon [size]="30"></svg>
        No encontramos este grupo
      </app-status-header>
      <p class="mt-1.5 text-ink-muted">
        Puede que el enlace no esté bien o que el grupo ya no exista.
      </p>
    </div>
  } @else {
    <p appAlert class="mt-6">No hemos podido cargar el grupo. Inténtalo de nuevo.</p>
    <button type="button" appButton="secondary" class="mt-4" (click)="reload()">Reintentar</button>
  }
</app-shell>
