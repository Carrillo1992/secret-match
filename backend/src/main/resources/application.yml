# Shared by every profile. Every secret and URL comes from an environment variable;
# see .env.example at the repo root for the full list.
spring:
  application:
    name: secret-match-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  task:
    execution:
      # Emails have their own executor (NotificationConfiguration). Without this, Boot would drop its
      # general-purpose one, and anything else asynchronous would end up on the small email pool.
      mode: force

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGIN}
        allowed-methods: GET
  endpoint:
    health:
      show-details: never

secretmatch:
  web:
    # The SPA's origin: the only one allowed to call /api/** from a browser.
    allowed-origin: ${CORS_ALLOWED_ORIGIN}
  security:
    jwt:
      # Base64 of at least 32 random bytes (e.g. `openssl rand -base64 32`). It signs every access
      # token: changing it signs everybody out of their current access token.
      signing-key: ${JWT_SIGNING_KEY}
    google:
      # The OAuth client id from Google Cloud (not a secret). Empty turns "Continuar con Google" off: every
      # Google ID token is refused.
      client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    # Every email is sent from this address, under the name SecretMatch.
    from-address: ${MAIL_FROM_ADDRESS}
    # The SPA's public address; email links point into it.
    app-base-url: ${APP_BASE_URL}
  # Throttling of the signed-out identity endpoints (ADR 0006). Each limit is `capacity` requests per
  # `period`, all back once the period has passed. Override any of them with an environment variable,
  # e.g. SECRETMATCH_RATELIMIT_DAILYEMAILCAP=80 or SECRETMATCH_RATELIMIT_PERIP_SIGNIN_CAPACITY=20.
  rate-limit:
    # Proxies in front of the API that append to X-Forwarded-For. 0: the remote address is the client.
    trusted-proxies: 0
    # Verification and Password Reset emails per UTC day, in total; keep it below the Resend quota.
    daily-email-cap: 50
    # Silent: over the limit the request answers as usual, but nothing is saved or sent.
    per-email:
      sign-up: { capacity: 3, period: 1h }
      new-verification-link: { capacity: 3, period: 1h }
      reset-link: { capacity: 3, period: 1h }
    # Answered with 429 and Retry-After.
    per-ip:
      sign-up: { capacity: 5, period: 1h }
      # Asking for a reset link or a new verification link, together.
      link-email: { capacity: 10, period: 1h }
      sign-in: { capacity: 10, period: 1m }
      password-reset: { capacity: 10, period: 15m }

springdoc:
  # Health is in the OpenAPI document so the SPA reaches it through the generated client.
  # Only exposed actuator endpoints are documented (health, see above).
  show-actuator: true
  # Stable key order keeps the committed openapi.json snapshot diff-friendly.
  writer-with-order-by-keys: true
