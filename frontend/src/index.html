<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SecretMatch · Tu amigo invisible, sin papelitos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The link preview (#115). Static on purpose: WhatsApp and other crawlers do not run JavaScript,
      and the English copy only loads at runtime (ADR 0005), so these stay in Spanish, the source
      Language. og-image.png is 1200×630.
    -->
    <meta
      name="description"
      content="Organiza el amigo invisible con tu familia, tus amigos o tu oficina: un enlace para unirse, listas de deseos y un sorteo secreto. Gratis y sin anuncios."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SecretMatch" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://app.secret-match.app/" />
    <meta property="og:title" content="SecretMatch · Tu amigo invisible, sin papelitos" />
    <meta
      property="og:description"
      content="Un enlace para unirse, listas de deseos y un sorteo secreto. Gratis y sin anuncios."
    />
    <meta property="og:image" content="https://app.secret-match.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SecretMatch: Tu amigo invisible, sin papelitos. Un regalo envuelto sobre fondo crema."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // A forced Theme (ADR 0005) goes on <html> before the first paint, so it never flashes the
      // other one. Same key as ThemePreference (core/preferences). No storage: the OS decides.
      try {
        var theme = localStorage.getItem('secretmatch.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
