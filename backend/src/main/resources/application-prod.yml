# Heroku: one Basic dyno (512 MB) and Heroku Postgres Essential-0 (20 connections at most). DATABASE_URL is the
# postgres:// URL Heroku sets and rotates; HerokuDatabaseUrl turns it into the datasource, with SSL required.
spring:
  datasource:
    hikari:
      # Well under the 20 connections of Essential-0, leaving room for `heroku pg:psql` and a deploy's overlap.
      maximum-pool-size: 5

server:
  tomcat:
    threads:
      # Each request thread costs a stack (512 KB, see backend/Dockerfile); fewer than 100 users never need 200.
      max: 50

springdoc:
  swagger-ui:
    enabled: false

secretmatch:
  mail:
    resend:
      api-key: ${RESEND_API_KEY}
  rate-limit:
    # Heroku: only the Heroku router sits in front of the API (api.<domain> is DNS-only in Cloudflare, not
    # proxied). The router keeps any X-Forwarded-For the client sent and appends the address it got the
    # connection from, so the client is the rightmost entry; anything further left was sent by the client.
    trusted-proxies: 1

# Pinned so a stray DEBUG or TRACE on a parent logger (root, org.springframework, org.apache) cannot print a
# request's headers, cookies or body: Tomcat logs the raw request, with the Authorization header and the refresh
# cookie, and Spring's HTTP client logs the bodies it sends (#101). Raise one of these only to debug, never in prod.
logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.apache.coyote: INFO
    org.apache.tomcat: INFO
    org.apache.catalina: INFO
