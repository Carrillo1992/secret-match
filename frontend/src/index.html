<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SecretMatch</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // A forced Theme (ADR 0005) goes on <html> before the first paint, so it never flashes the
      // other one. Same key as ThemePreference (core/preferences). No storage: the OS decides.
      try {
        var theme = localStorage.getItem('secretmatch.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
