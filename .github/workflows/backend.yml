# Runs the backend checks of docs/verification.md §2 on PRs that touch the backend.
name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Formatting
        run: ./mvnw -B spotless:check

      # Testcontainers uses the Docker daemon that ubuntu-latest runners ship with.
      - name: Build, tests, ArchUnit, coverage and OpenAPI snapshot
        run: ./mvnw -B verify
