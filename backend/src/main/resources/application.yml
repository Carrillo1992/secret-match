# Shared by every profile. Every secret and URL comes from an environment variable;
# see .env.example at the repo root for the full list.
spring:
  application:
    name: secret-match-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGIN}
        allowed-methods: GET
  endpoint:
    health:
      show-details: never

secretmatch:
  web:
    # The SPA's origin: the only one allowed to call /api/** from a browser.
    allowed-origin: ${CORS_ALLOWED_ORIGIN}
  security:
    jwt:
      # Base64 of at least 32 random bytes (e.g. `openssl rand -base64 32`). It signs every access
      # token: changing it signs everybody out of their current access token.
      signing-key: ${JWT_SIGNING_KEY}
  mail:
    # Every email is sent from this address, under the name SecretMatch.
    from-address: ${MAIL_FROM_ADDRESS}
    # The SPA's public address; email links point into it.
    app-base-url: ${APP_BASE_URL}

springdoc:
  # Health is in the OpenAPI document so the SPA reaches it through the generated client.
  # Only exposed actuator endpoints are documented (health, see above).
  show-actuator: true
  # Stable key order keeps the committed openapi.json snapshot diff-friendly.
  writer-with-order-by-keys: true
